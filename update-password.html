<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose New Password | Dawson Deals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-box">
      <h1>Choose a New Password</h1>
      <p>Create a new password for your Dawson Deals account.</p>

      <form id="updatePasswordForm">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Enter password again"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button type="submit">Update Password</button>
      </form>

      <p id="updateMessage" role="status"></p>
      <p><a href="login.html">Back to Login</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://tsvokbhzwupbomrvutvk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BgT1WS-1sUZcXZja9eilIg_kaOD7S5e";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
const updateMessage = document.getElementById("updateMessage");
const updateButton = document.querySelector(
  '#updatePasswordForm button[type="submit"]'
);

let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    recoveryReady = true;
    updateMessage.textContent =
      "Recovery verified. You can now choose a new password.";
    return;
  }

  if (session) {
    recoveryReady = true;
  }
});

(async function checkRecoverySession() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error || !data.session) {
    updateMessage.textContent =
      "Open this page using the recovery link sent to your email.";
    updateButton.disabled = true;
    return;
  }

  recoveryReady = true;
})();
    document.getElementById("updatePasswordForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      const message = document.getElementById("updateMessage");
      const button = this.querySelector('button[type="submit"]');

      if (password !== confirmation) {
        message.textContent = "Your passwords do not match.";
        return;
      }

      if (password.length < 8) {
        message.textContent = "Use at least 8 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Password update failed. Your recovery link may have expired. Request a new one and try again.";
      } else {
        message.textContent = "Password updated successfully! You can now log in with your new password.";
        this.reset();
      }

      button.disabled = false;
      button.textContent = "Update Password";
    });
  </script>
</body>
</html>
