<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Dawson Deals</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <div class="logo auth-logo">
        DAWSON<span>DEALS</span>
      </div>

      <p class="eyebrow">JOIN DAWSON DEALS</p>

      <h1>Create your account</h1>

      <p class="auth-subtitle">
        Create an account to browse deals and use Dawson Deals.
      </p>

      <form id="signupForm">

        <label for="fullName">Full name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          required
        >

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="phone">Contact number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your contact number"
          required
        >
<label for="accountType">Account type</label>

<select id="accountType" required>
  <option value="">Choose account type</option>
  <option value="buyer">Buyer</option>
  <option value="seller">Seller</option>
</select>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
        >

<div class="password-strength" aria-live="polite">
  <div class="strength-track">
    <div id="strengthBar" class="strength-fill"></div>
  </div>
  <p id="strengthText">Password strength: Not entered</p>
</div>

        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          required
        >

        <button type="submit">
          Create Account
        </button>

      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Log In</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Dawson Deals
      </a>

    </div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
const SUPABASE_URL = "https://tsvokbhzwupbomrvutvk.supabase.co";
const SUPABASE_KEY = "sb_publishable_BgT1WS-1sUZcXZja9eilIg_kaOD7S5e";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
document.getElementById("signupForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const accountType = document.getElementById("accountType").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match.");
    return;
  }

  if (!accountType) {
    alert("Please choose Buyer or Seller.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        full_name: fullName,
        phone: phone,
        account_type: accountType
      }
    }
  });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Account created successfully! Please log in to continue.");
  window.location.href = "login.html";
});

</script>

<script>
const strengthPassword = document.getElementById("password");
const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");

if (strengthPassword && strengthBar && strengthText) {
  strengthPassword.addEventListener("input", function () {
    const value = strengthPassword.value;
    let score = 0;

    if (value.length >= 8) score++;
    if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
    if (/[0-9]/.test(value)) score++;
    if (/[^A-Za-z0-9]/.test(value)) score++;

    const levels = [
      { label: "Not entered", width: "0%", color: "#9ca3af" },
      { label: "Weak", width: "25%", color: "#ef4444" },
      { label: "Fair", width: "50%", color: "#f97316" },
      { label: "Good", width: "75%", color: "#2563eb" },
      { label: "Strong", width: "100%", color: "#16a34a" }
    ];

    const level = value.length === 0
      ? levels[0]
      : levels[Math.max(1, score)];

    strengthBar.style.width = level.width;
    strengthBar.style.background = level.color;
    strengthText.textContent = "Password strength: " + level.label;
  });
}
</script>

</body>
</html>
