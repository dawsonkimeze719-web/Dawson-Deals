<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In | Dawson Deals</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <div class="logo auth-logo">
        DAWSON<span>DEALS</span>
      </div>

      <p class="eyebrow">WELCOME BACK</p>

      <h1>Log in to your account</h1>

      <p class="auth-subtitle">
        Access your Dawson Deals account and continue exploring.
      </p>

      <form id="loginForm">

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Log In
        </button>

      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Dawson Deals
      </a>

    </div>

  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      alert("Login page is ready. Next we will connect it to the real account system.");
    });
  </script>

</body>
</html>
