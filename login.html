<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In | Dawson Deals</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="auth-page">

    <div class="auth-box">

      <div class="logo auth-logo">
        DAWSON<span>DEALS</span>
      </div>

      <p class="eyebrow">WELCOME BACK</p>

      <h1>Log in to your account</h1>

      <p class="auth-subtitle">
        Access your Dawson Deals account and continue exploring.
      </p>

      <form id="loginForm">

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Log In
        </button>

      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Dawson Deals
      </a>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tsvokbhzwupbomrvutvk.supabase.co";
const SUPABASE_KEY = "sb_publishable_BgT1WS-1sUZcXZja9eilIg_kaOD7S5e";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
    return;
  }

  const accountType = data.user?.user_metadata?.account_type;

if (accountType === "seller") {
  window.location.href = "seller.html";
} else {
  window.location.href = "dashboard.html";
}
});
</script>

</body>
</html>
