<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In | Dawson Deals</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="premium-auth">

  <div class="auth-slideshow" aria-hidden="true">
    <div class="auth-slide active" style="background-image: url('images/U.png')"></div>
    <div class="auth-slide" style="background-image: url('images/Uy.png')"></div>
    <div class="auth-slide" style="background-image: url('images/file_000000006be481fa82a05873d90ca0a2.png')"></div>
    <div class="auth-slide" style="background-image: url('images/file_00000000e78081fab385f7581c2783c9.png')"></div>
    <div class="auth-slide" style="background-image: url('images/file_00000000e78081fab385f7581c2783c9 (1).png')"></div>
  </div>

  <main class="auth-page">

    <div class="auth-box">

      <div class="logo auth-logo">
        DAWSON<span>DEALS</span>
      </div>

      <p class="eyebrow">WELCOME BACK</p>

      <h1>Log in to your account</h1>

      <p class="auth-subtitle">
        Access your Dawson Deals account and continue exploring.
      </p>

      <form id="loginForm">
  <button
    type="button"
    class="password-toggle"
    data-toggle-password="password"
    aria-label="Show password"
  >Show</button>
</div>
<p class="forgot-password">
  <a href="reset-password.html">Forgot Password?</a>
</p>

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Log In
        </button>

      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Dawson Deals
      </a>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tsvokbhzwupbomrvutvk.supabase.co";
const SUPABASE_KEY = "sb_publishable_BgT1WS-1sUZcXZja9eilIg_kaOD7S5e";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert(error.message);
    return;
  }

  const accountType = data.user?.user_metadata?.account_type;

if (accountType === "seller") {
  window.location.href = "seller.html";
} else {
  window.location.href = "dashboard.html";
}
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const slides = document.querySelectorAll(".auth-slide");

  if (slides.length < 2) return;

  let currentSlide = 0;

  slides.forEach((slide, index) => {
    slide.classList.toggle("active", index === 0);
  });

  setInterval(() => {
    slides[currentSlide].classList.remove("active");

    currentSlide = (currentSlide + 1) % slides.length;

    slides[currentSlide].classList.add("active");
  }, 4500);
});
</script>

<script>
document.querySelectorAll("[data-toggle-password]").forEach(function(button) {
  button.addEventListener("click", function() {
    const input = document.getElementById(button.dataset.togglePassword);
    if (!input) return;

    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    button.textContent = showing ? "Show" : "Hide";
    button.setAttribute(
      "aria-label",
      showing ? "Show password" : "Hide password"
    );
  });
});
</script>

</body>
</html>
