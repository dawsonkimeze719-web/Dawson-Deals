<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Dawson Deals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-box">
      <h1>Reset Your Password</h1>
      <p>Enter your registered email and we'll send you a recovery link.</p>

      <form id="resetForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your registered email"
          autocomplete="email"
          required
        >
        <button type="submit">Send Recovery Link</button>
      </form>

      <p id="resetMessage" role="status"></p>
      <p><a href="login.html">Back to Login</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://tsvokbhzwupbomrvutvk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_BgT1WS-1sUZcXZja9eilIg_kaOD7S5e";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document.getElementById("resetForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("resetMessage");
      const button = this.querySelector('button[type="submit"]');

      button.disabled = true;
      button.textContent = "Sending...";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname.replace(
          "reset-password.html",
          "update-password.html"
        )
      });

      message.textContent = error
        ? "We couldn't send the recovery email. Please check your settings and try again."
        : "If your account exists, a recovery email will be sent. Check your inbox.";

      button.disabled = false;
      button.textContent = "Send Recovery Link";
    });
  </script>
</body>
</html>
